openapi: 3.1.0
info:
  title: Book lending
  contact:
    name: Eduardo Tavares
    email: eduardodinis3@gmail.com
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /users/owned/{ISBN}:
    post:
      tags:
      - user-controller
      operationId: addBookOwned
      parameters:
      - name: ISBN
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/IsbnString"
      - name: Authorization
        in: header
        description: Authorization header
        required: true
        schema:
          type: string
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: OK
        "400":
          description: User in question already owns book in question
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Book in question does not exist in the server
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Account needs bearer authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /users/blacklist/{email}:
    post:
      tags:
      - user-controller
      operationId: addBlacklist
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Authorization header
        required: true
        schema:
          type: string
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: OK
        "404":
          description: User in question does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Account needs to have the role: ROLE_ADMIN"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Account needs bearer authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /userAuth/login:
    post:
      tags:
      - user-authentication-controller
      operationId: login
      requestBody:
        description: information necessary to login
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "201":
          description: login token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginToken"
        "404":
          description: User does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: User or password invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /userAuth/createUser:
    post:
      tags:
      - user-authentication-controller
      operationId: createUser
      requestBody:
        description: information necessary to create user
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreation"
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "201":
          description: login token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginToken"
        "400":
          description: Email already attached to one user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /books/{ISBN}:
    post:
      tags:
      - book-controller
      summary: "Add a book to the system so it can be recognized, by giving an id\
        \ and letting the server check if it exists"
      description: "Add a book to the system so it can be recognized, by giving an\
        \ id and letting the server check if it exists"
      operationId: postBook
      parameters:
      - name: ISBN
        in: path
        description: ISBN to identify book
        required: true
        schema:
          $ref: "#/components/schemas/IsbnString"
      - name: Authorization
        in: header
        description: Authorization header
        required: true
        schema:
          type: string
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "201":
          description: Added book
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: |-
            Was given an ISBN 10 identifier already in database;
                Was given an ISBN 13 identifier already in database
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Book was not found to exist from given ISBN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Account needs bearer authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /books/request:
    post:
      tags:
      - book-controller
      operationId: requestBook
      parameters:
      - name: Authorization
        in: header
        description: Authorization header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCreation"
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: OK
        "400":
          description: |-
            Target user does not own book;
                Current book from user was already requested;
                Requesting book from self is not allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Account needs bearer authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /books/lend:
    post:
      tags:
      - book-controller
      operationId: lendBook
      parameters:
      - name: Authorization
        in: header
        description: Authorization header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LendCreation"
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: OK
        "404":
          description: |-
            Identified request does not exist;
                A book can only be lent if it is not being currently lent to another

             Note: this is more restrictive than database model, which allows for multiple lends of the same book.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Account needs bearer authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /users/owned/{userId}:
    get:
      tags:
      - user-controller
      summary: Get list of books owned by a user
      description: Get list of books owned by a user
      operationId: booksOwned
      parameters:
      - name: userId
        in: path
        description: id of user in question
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: page number. First is 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: list of owned books
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListedDataBook"
        "404":
          description: User in question does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /users/owned/{userId}/requests/{bookId}:
    get:
      tags:
      - user-controller
      summary: Gets requests of book owned by user
      description: Gets requests of book owned by user
      operationId: bookRequests
      parameters:
      - name: userId
        in: path
        description: id of user that owns the book
        required: true
        schema:
          type: integer
          format: int32
      - name: bookId
        in: path
        description: id of owned book
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: pagination parameter. First page is 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: list of requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListedDataRequest"
        "400":
          description: Book in question is not owned by user in question
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /books/owners/{ISBN}:
    get:
      tags:
      - book-controller
      summary: Get owners of a specific book
      description: Get owners of a specific book
      operationId: getBookOwners
      parameters:
      - name: ISBN
        in: path
        description: ISBN of book in question
        required: true
        schema:
          $ref: "#/components/schemas/IsbnString"
      - name: page
        in: query
        description: "page number, starts at 0"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: Authorization
        in: header
        description: Authorization header
        required: true
        schema:
          type: string
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: list of books
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListedDataUser"
        "404":
          description: Book does not exist on database
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Account needs bearer authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /books/:
    get:
      tags:
      - book-controller
      summary: General list book search by segments
      description: General list book search by segments
      operationId: getBooks
      parameters:
      - name: page
        in: query
        description: optional parameter (defaulted to 0) to indicate the page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: list of books
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListedDataBook"
  /userAuth/logout:
    delete:
      tags:
      - user-authentication-controller
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        description: Authorization header
        required: true
        schema:
          type: string
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Problem Detail with message specific to the parameter violations
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "200":
          description: OK
        "401":
          description: Account needs bearer authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ValidationProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        validationIssues:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    IsbnString:
      type: object
      description: |-
        In special class to contain validation annotations, helps both spring and code recognize that it has restriction due
         to it being glued to the class
      properties:
        ISBN:
          type: string
          format: ISBN
          description: "ISBN string, either ISBN 10 or 13. Should also respect ISBN\
            \ checksum"
          pattern: "^([0-9]{9}|[0-9]{12})([0-9x-xX-X]{1}$)"
      required:
      - ISBN
    UserLogin:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    LoginToken:
      type: object
      description: Information necessary to authenticate
      properties:
        token:
          type: string
          description: the bearer token
      required:
      - token
    UserCreation:
      type: object
      description: data class with information necessary to create user
      properties:
        email:
          type: string
          description: "email to be associated to user, cannot be in use for another\
            \ account at the same time"
        password:
          type: string
          description: clear password to use on login
          maxLength: 2147483647
          minLength: 8
          pattern: ".*(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^a-z0-9A-Z]).*"
        x:
          type: number
          format: double
          description: x coordinate of user location
          maximum: 180
          minimum: -180
        "y":
          type: number
          format: double
          description: y coordinate of user location
          maximum: 90
          minimum: -90
      required:
      - email
      - password
    Book:
      type: object
      description: |-
        Since this service is about physical books, it assumes the existence of the ISBN. It may be either ISBN 10 or
         ISBN 13 or even both, but never neither.
         <p>
         Due to this restriction, this class can only one of {@link Book#isbnTen Book#isbnTen}
         or {@link Book#isbnThirteen Book#isbnThirteen} fields as null
      properties:
        id:
          type: integer
          format: int32
        isbnTen:
          type: string
        isbnThirteen:
          type: string
        title:
          type: string
        language:
          type: string
          enum:
          - English
          - Portuguese
          - Spanish
          - French
          - German
          - Russian
          - Japanese
          - Italian
          - Hebrew
          - Hungarian
          - Danish
    RequestCreation:
      type: object
      properties:
        isbn:
          type: string
          format: ISBN
          description: "book identifier, either 10 or 13 numbers. Should also respect\
            \ checksum"
          pattern: "^([0-9]{9}|[0-9]{12})([0-9x-xX-X]{1}$)"
        ownerEmail:
          type: string
          description: unique identifier of book's owner
        timeInDays:
          type: integer
          format: int32
          description: Duration of request
          minimum: 1
      required:
      - isbn
      - ownerEmail
      - timeInDays
    LendCreation:
      type: object
      properties:
        isbn:
          type: string
          format: ISBN
          description: "book identifier, either 10 or 13 numbers"
          pattern: "^([0-9]{9}|[0-9]{12})([0-9x-xX-X]{1}$)"
        receiverEmail:
          type: string
          description: unique identifier of book's requester
          minLength: 1
      required:
      - isbn
      - receiverEmail
    ListedDataBook:
      type: object
      description: Generic data class for a list of possibly incomplete data.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required:
      - data
      - hasNextPage
      - hasPreviousPage
    ListedDataRequest:
      type: object
      description: Generic data class for a list of possibly incomplete data.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Request"
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required:
      - data
      - hasNextPage
      - hasPreviousPage
    Owned:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/OwnedId"
        user:
          $ref: "#/components/schemas/User"
        book:
          $ref: "#/components/schemas/Book"
    OwnedId:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        bookId:
          type: integer
          format: int32
    Request:
      type: object
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        owned:
          $ref: "#/components/schemas/Owned"
        date:
          type: string
          format: date-time
        duration:
          type: integer
          format: int32
    RequestId:
      type: object
      properties:
        requested:
          $ref: "#/components/schemas/OwnedId"
        userId:
          type: integer
          format: int32
    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
          maxLength: 70
          minLength: 0
        isAdmin:
          type: boolean
        enabled:
          type: boolean
    ListedDataUser:
      type: object
      description: Generic data class for a list of possibly incomplete data.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required:
      - data
      - hasNextPage
      - hasPreviousPage
  headers:
    Authentication:
      description: Bearer token required
      required: true
      schema:
        type: string
  securitySchemes:
    bearer:
      type: http
      name: Authorization
      in: header
      scheme: bearer
