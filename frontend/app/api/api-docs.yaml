openapi: 3.1.0
info:
  title: Book lending
  contact:
    name: Eduardo Tavares
    email: eduardodinis3@gmail.com
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /users/owned/{ISBN}:
    post:
      tags:
      - user-controller
      operationId: addBookOwned
      parameters:
      - name: ISBN
        in: path
        required: true
        schema:
          type: string
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
        "400":
          description: User in question already owns book in question
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Book in question does not exist in the server
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /users/blacklist/{email}:
    post:
      tags:
      - user-controller
      operationId: addBlacklist
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
        "404":
          description: User in question does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Account needs to have the role: ROLE_ADMIN"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /userAuth/login:
    post:
      tags:
      - user-authentication-controller
      operationId: login
      requestBody:
        description: information necessary to login
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
        required: true
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "201":
          description: login token
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: User or password invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /userAuth/createUser:
    post:
      tags:
      - user-authentication-controller
      operationId: createUser
      requestBody:
        description: information necessary to create user
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreation"
        required: true
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "201":
          description: login token
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: |-
            Email already attached to one user;
                Password is not safe enough. Exact requirements to be communicated better;
                Given latitude is not possible;
                Given longitude is not possible
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /books/{ISBN}:
    post:
      tags:
      - book-controller
      summary: "Add a book to the system so it can be recognized, by giving an id\
        \ and letting the server check if it exists"
      description: "Add a book to the system so it can be recognized, by giving an\
        \ id and letting the server check if it exists"
      operationId: postBook
      parameters:
      - name: ISBN
        in: path
        description: ISBN to identify book
        required: true
        schema:
          type: string
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "201":
          description: Added book
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: |-
            Was given an ISBN 10 identifier already in database;
                Was given an ISBN 13 identifier already in database
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Book was not found to exist from given ISBN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /books/request:
    post:
      tags:
      - book-controller
      operationId: requestBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCreation"
        required: true
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
        "400":
          description: |-
            Target user does not own book;
                Current book from user was already requested;
                Requesting book from self is not allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /books/lend:
    post:
      tags:
      - book-controller
      operationId: lendBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LendCreation"
        required: true
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
        "404":
          description: |-
            Identified request does not exist;
                A book can only be lent if it is not being currently lent to another

             Note: this is more restrictive than database model, which allows for multiple lends of the same book.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearer: []
  /users/owned/{userId}:
    get:
      tags:
      - user-controller
      summary: Get list of books owned by a user
      description: Get list of books owned by a user
      operationId: booksOwned
      parameters:
      - name: userId
        in: path
        description: id of user in question
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: page number. First is 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: list of owned books
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListedData"
        "404":
          description: User in question does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /users/owned/{userId}/requests/{bookId}:
    get:
      tags:
      - user-controller
      summary: Gets requests of book owned by user
      description: Gets requests of book owned by user
      operationId: bookRequests
      parameters:
      - name: userId
        in: path
        description: id of user that owns the book
        required: true
        schema:
          type: integer
          format: int32
      - name: bookId
        in: path
        description: id of owned book
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: pagination parameter. First page is 0
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: list of requests
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListedData"
        "400":
          description: Book in question is not owned by user in question
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /books/owners/{ISBN}:
    get:
      tags:
      - book-controller
      summary: Get owners of a specific book
      description: Get owners of a specific book
      operationId: getBookOwners
      parameters:
      - name: page
        in: query
        description: "page number, starts at 0"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: list of books
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListedData"
        "404":
          description: Book does not exist on database
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /books/:
    get:
      tags:
      - book-controller
      summary: General list book search by segments
      description: General list book search by segments
      operationId: getBooks
      parameters:
      - name: page
        in: query
        description: optional parameter (defaulted to 0) to indicate the page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: list of books
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListedData"
  /userAuth/logout:
    delete:
      tags:
      - user-authentication-controller
      operationId: logout
      responses:
        "422":
          description: Problem Detail with message specific to the parameter violation
            detected from the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
      security:
      - bearer: []
components:
  schemas:
    ProblemDetail:
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
      required:
      - detail
      - instance
      - properties
      - status
      - title
      - type
    UserLogin:
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    UserCreation:
      properties:
        email:
          type: string
        password:
          type: string
        x:
          type: number
          format: double
        "y":
          type: number
          format: double
      required:
      - email
      - password
      - x
      - "y"
    Book:
      properties:
        id:
          type: integer
          format: int32
        isbnTen:
          type: string
        isbnThirteen:
          type: string
        title:
          type: string
        language:
          type: string
          enum:
          - English
          - Portuguese
          - Spanish
          - French
          - German
          - Russian
          - Japanese
          - Italian
          - Hebrew
          - Hungarian
          - Danish
      required:
      - id
      - isbnTen
      - isbnThirteen
      - language
      - title
    RequestCreation:
      properties:
        isbn:
          type: string
        ownerEmail:
          type: string
        timeInDays:
          type: integer
          format: int32
      required:
      - isbn
      - ownerEmail
      - timeInDays
    LendCreation:
      properties:
        isbn:
          type: string
        receiverEmail:
          type: string
      required:
      - isbn
      - receiverEmail
    ListedData:
      properties:
        data:
          type: array
          items:
            type: object
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required:
      - data
      - hasNextPage
      - hasPreviousPage
  securitySchemes:
    bearer:
      type: http
      name: Authorization
      in: header
      scheme: bearer
