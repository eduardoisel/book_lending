spring:
  sql:
    init:
      mode: "embedded"
  jpa:
    defer-datasource-initialization: true
    open-in-view: true
    generate-ddl: true

    #database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        ddl-auto: "create"

  datasource:
    hikari: ## default connection pool
      connectionTimeout: 2000
      maximumPoolSize: 5
    username: dbuser
    password: changeit
    ##H2
    url: jdbc:h2:mem:db
    driver-class-name: org.h2.Driver


  # swagger-ui custom path
  springdoc:
    swagger-ui:
      path: /swagger-ui.html # http://localhost:8080/swagger-ui.html
